<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Tic Tac Toe</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <main>
      <h1>Tic Tac Toe</h1>
      <p id="game-status" class="game-status" role="status" aria-live="polite">Player X's turn.</p>
      <div class="board" role="grid" aria-label="Tic Tac Toe board"></div>
      <button type="button" id="reset-game" class="reset-game">Reset game</button>
      <p class="help-text">Press Escape at any time to reset the game.</p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
